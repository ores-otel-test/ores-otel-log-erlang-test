name: ORES middleware Erlang/Cowboy/OTel stress

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "31 8 * * *"

permissions:
  contents: read

concurrency:
  group: ores-middleware-erlang-${{ github.ref }}
  cancel-in-progress: true

env:
  ORES_MIDDLEWARE_SHA: d588e7bf890c337500641ed06d0b90f7b7a57748

jobs:
  erlang:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-middleware
          ref: ${{ env.ORES_MIDDLEWARE_SHA }}
          path: middleware
          persist-credentials: false
          fetch-depth: 1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "27.3.4.14"
          rebar3-version: "3.24.0"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Prove immutable upstream checkout
        run: |
          set -euo pipefail
          test "$(git -C middleware rev-parse HEAD)" = "$ORES_MIDDLEWARE_SHA"
          test -z "$(git -C middleware status --porcelain)"
      - name: Compile and classify lock drift
        run: |
          set -euo pipefail
          cd middleware/src/erlang
          rebar3 compile
          if git diff --quiet -- rebar.lock; then
            echo "ORES_MIDDLEWARE_ERLANG_LOCK_DRIFT=false" >> "$GITHUB_ENV"
          else
            echo "ORES_MIDDLEWARE_ERLANG_LOCK_DRIFT=true" >> "$GITHUB_ENV"
            echo "::warning file=middleware/src/erlang/rebar.lock::rebar dependency resolution changed committed lock metadata; tests continue and reproducibility is enforced at the end"
          fi
      - name: Repeat native Erlang/Cowboy tests
        run: |
          set -euo pipefail
          cd middleware/src/erlang
          for iteration in 1 2 3 4 5; do
            echo "Erlang middleware iteration $iteration"
            rebar3 eunit
          done
      - name: Validate Erlang runtime descriptor
        run: |
          set -euo pipefail
          cd middleware/src/erlang
          descriptor="$(escript escript/contractcheck.escript)"
          printf '%s\n' "$descriptor" | jq -e '
            .contractVersion == "1.0.0" and
            .language == "erlang" and
            (.frameworkAdapters | index("cowboy")) != null and
            (.capabilities | index("request-context")) != null and
            (.capabilities | index("deadline-timeout")) != null and
            (.capabilities | index("auth")) != null
          '
      - name: Run randomized adversarial Erlang suite
        run: |
          set -euo pipefail
          cd middleware
          cargo run --quiet --manifest-path tools/middleware-adversarial-runner/Cargo.toml --package middleware-adversarial-runner -- --language erlang --iterations 10 --output-dir target/test-org/erlang/logs --receipt target/test-org/erlang/receipt.json
          jq -e '.passed == true and (.runs | length) == 10 and all(.runs[]; .passed == true and .exit_code == 0)' target/test-org/erlang/receipt.json
      - name: Prove authored Erlang source stayed immutable
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git -C middleware diff --exit-code -- src/erlang/src src/erlang/test src/erlang/rebar.config src/erlang/escript
      - name: Record dependency lock drift
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p middleware/target/test-org/erlang
          if ! git -C middleware diff --quiet -- src/erlang/rebar.lock; then
            git -C middleware diff -- src/erlang/rebar.lock > middleware/target/test-org/erlang/rebar-lock.diff
          fi
      - name: Retain Erlang evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ores-otel-test-erlang-middleware-${{ github.run_id }}
          path: middleware/target/test-org/erlang
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce dependency-lock reproducibility
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ "${ORES_MIDDLEWARE_ERLANG_LOCK_DRIFT:-false}" = "true" ]; then
            echo "::error file=middleware/src/erlang/rebar.lock::Erlang dependency resolution changed committed lock metadata; upstream lock must be refreshed before promotion"
            exit 1
          fi
